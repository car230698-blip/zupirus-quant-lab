# Compose staging override for isolated VPS test environment
# Maps API strictly to 127.0.0.1:3101 and eliminates host port exposure for internal database/redis.
services:
  timescaledb:
    ports: !reset []
  redis:
    ports: !reset []
  api:
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin_staging_secure_pass_2026}
    ports: !override
      - "127.0.0.1:3101:8000"

