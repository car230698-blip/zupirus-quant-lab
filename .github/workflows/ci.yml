name: ZUPIRUS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend CI (FastAPI, Quant Engine, Safety Shields, Billing)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      timescaledb:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: zupirus
          POSTGRES_PASSWORD: zupirus_ci_password
          POSTGRES_DB: zupirus
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Astral uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies with uv
        run: |
          uv pip install --system -r requirements.lock ruff

      - name: Lint and Static Analysis
        run: |
          ruff check app/ cli/ tests/ --select E9,F63,F7,F82
          python scripts/verify_package.py

      - name: Verify Live PostgreSQL/TimescaleDB & Redis Migrations
        env:
          DATABASE_URL: "postgresql://zupirus:zupirus_ci_password@localhost:5432/zupirus"
          REDIS_URL: "redis://localhost:6379/0"
          ENCRYPTION_KEY: "ci_test_encryption_key_32bytes_min!"
        run: |
          python -c "from app.db import init, check_db_health; init(); h = check_db_health(); print(h); assert h['status'] == 'up' and h['is_postgres']"
          python -m cli healthcheck --json

      - name: Run Pytest Test Suite
        env:
          ALLOW_REAL: "false"
          COOKIE_SECURE: "false"
          DATA_DIR: "/tmp/zupirus_test_data"
          DATABASE_URL: "postgresql://zupirus:zupirus_ci_password@localhost:5432/zupirus"
          REDIS_URL: "redis://localhost:6379/0"
          ENCRYPTION_KEY: "ci_test_encryption_key_32bytes_min!"
        run: |
          python -m pytest tests/ -v --junitxml=test-results.xml

      - name: Verify CLI Healthcheck Command
        run: |
          python -m cli healthcheck --json

      - name: Upload Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: test-results.xml

  frontend-test:
    name: Frontend CI (TypeScript, Multi-Domain Vite SPA Build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      timescaledb:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: zupirus
          POSTGRES_PASSWORD: zupirus_ci_password
          POSTGRES_DB: zupirus
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Check TypeScript Types
        run: npm run lint

      - name: Build Production Frontend
        run: npm run build

      - name: Run Frontend Tests
        run: |
          npm test
          npx --yes tsx --test web/src/utils/quantMath.test.ts web/src/utils/stateMapping.test.ts web/src/components/PortalComponents.test.tsx
