name: ZUPIRUS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend CI (FastAPI, Quant Engine, Safety Shields, Billing)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install ruff

      - name: Lint and Static Analysis
        run: |
          ruff check app/ cli/ tests/ --exit-zero
          python scripts/verify_package.py

      - name: Run Pytest Test Suite
        env:
          ALLOW_REAL: "false"
          COOKIE_SECURE: "false"
          DATA_DIR: "/tmp/zupirus_test_data"
        run: |
          python -m pytest tests/ -v --junitxml=test-results.xml

      - name: Verify CLI Healthcheck Command
        run: |
          python -m cli healthcheck --json

      - name: Upload Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: test-results.xml

  frontend-test:
    name: Frontend CI (TypeScript, Multi-Domain Vite SPA Build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Check TypeScript Types
        run: npm run lint

      - name: Build Production Frontend
        run: npm run build

      - name: Run Frontend Tests
        run: npm test
