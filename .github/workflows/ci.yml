name: Demo safety and smoke
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.lock
      - run: python -m pytest -q --junitxml=docs/junit-ci.xml
      - run: python scripts/verify_package.py
      - run: python scripts/local_smoke.py
      - run: npm ci && python scripts/run_dom_smoke.py
      - run: bash scripts/docker_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: docs/junit-ci.xml
