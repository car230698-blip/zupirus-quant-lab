name: zupirus
x-app: &app
  build: .
  image: zupirus-lab:0.2.0
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  volumes:
    - lab_data:/data
  networks: [private]

services:
  timescaledb:
    image: timescale/timescaledb:2.32.0-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zupirus}
      POSTGRES_USER: ${POSTGRES_USER:-zupirus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-not-for-production}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-zupirus} -d $${POSTGRES_DB:-zupirus}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [private]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-dev-only-not-for-production}"]
    ports: ["127.0.0.1:6379:6379"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dev-only-not-for-production}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [private]

  api:
    <<: *app
    depends_on:
      timescaledb: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: postgresql://${POSTGRES_USER:-zupirus}:${POSTGRES_PASSWORD:-dev-only-not-for-production}@timescaledb:5432/${POSTGRES_DB:-zupirus}
      REDIS_URL: redis://:${REDIS_PASSWORD:-dev-only-not-for-production}@redis:6379/0
      COMMERCIAL_REPORTS_SALE_ENABLED: ${COMMERCIAL_REPORTS_SALE_ENABLED:-false}
      PAYMENT_USDT_ENABLED: ${PAYMENT_USDT_ENABLED:-false}
      GEMINI_API_KEYS: ${GEMINI_API_KEYS:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-4-hydrogen}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev-only-not-for-production-key}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@zupirus.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-dev-only-not-for-production}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,https://zupirus.com,https://www.zupirus.com,https://app.zupirus.com,https://adm.zupirus.com}
      FEED_TOKEN: ${FEED_TOKEN:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4.1-mini}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-zupirus-quant-lab}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-ZUPIRUS Quant Lab <system@zupirus.com>}
      USDT_TRC20_ADDRESS: ${USDT_TRC20_ADDRESS:-}
      USDT_BEP20_ADDRESS: ${USDT_BEP20_ADDRESS:-}
      TRADINGVIEW_WEBHOOK_SECRET: ${TRADINGVIEW_WEBHOOK_SECRET:-}
      DISCORD_WEBHOOK_SIGNALS: ${DISCORD_WEBHOOK_SIGNALS:-}
      DISCORD_WEBHOOK_ALERTS: ${DISCORD_WEBHOOK_ALERTS:-}
      DISCORD_WEBHOOK_BILLING: ${DISCORD_WEBHOOK_BILLING:-}
    ports: ["127.0.0.1:8080:8000"]
    networks:
      private:
      npm_default:
        aliases:
          - zupirus-api
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  research:
    <<: *app
    command: [python, -m, app.domains.quant.worker]
    depends_on:
      api: { condition: service_healthy }
      timescaledb: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: postgresql://${POSTGRES_USER:-zupirus}:${POSTGRES_PASSWORD:-dev-only-not-for-production}@timescaledb:5432/${POSTGRES_DB:-zupirus}
      REDIS_URL: redis://:${REDIS_PASSWORD:-dev-only-not-for-production}@redis:6379/0
      COMMERCIAL_REPORTS_SALE_ENABLED: ${COMMERCIAL_REPORTS_SALE_ENABLED:-false}
      PAYMENT_USDT_ENABLED: ${PAYMENT_USDT_ENABLED:-false}
      GEMINI_API_KEYS: ${GEMINI_API_KEYS:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-4-hydrogen}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev-only-not-for-production-key}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4.1-mini}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-zupirus-quant-lab}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-ZUPIRUS Quant Lab <system@zupirus.com>}
      USDT_TRC20_ADDRESS: ${USDT_TRC20_ADDRESS:-}
      USDT_BEP20_ADDRESS: ${USDT_BEP20_ADDRESS:-}
      TRADINGVIEW_WEBHOOK_SECRET: ${TRADINGVIEW_WEBHOOK_SECRET:-}
      DISCORD_WEBHOOK_SIGNALS: ${DISCORD_WEBHOOK_SIGNALS:-}
      DISCORD_WEBHOOK_ALERTS: ${DISCORD_WEBHOOK_ALERTS:-}
      DISCORD_WEBHOOK_BILLING: ${DISCORD_WEBHOOK_BILLING:-}
    healthcheck:
      test: [CMD, python, scripts/ops/worker_health.py, research_heartbeat]
      interval: 15s
      timeout: 5s
      retries: 4

  proxy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    profiles: [public]
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-admin@zupirus.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [private]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:2019/config/]
      interval: 30s
      timeout: 5s
      retries: 3

  tests:
    <<: *app
    profiles: [test]
    restart: "no"
    command: [python, -m, pytest, -q, -p, no:cacheprovider, tests]
    environment:
      DATA_DIR: /tmp/tests
      ADMIN_PASSWORD: test-only-admin-password-123
      COOKIE_SECURE: "false"
    volumes: []

volumes:
  lab_data:
  timescaledb_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  private:
  npm_default:
    external: true
