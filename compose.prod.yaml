# Production override for VPS deployment behind Nginx Proxy Manager
services:
  timescaledb:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zupirus_quant}
      POSTGRES_USER: ${POSTGRES_USER:-zupirus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production}
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in production}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in production}", "ping"]
    ports:
      - "127.0.0.1:6379:6379"

  api:
    environment:
      APP_ENV: "production"
      COOKIE_SECURE: "true"
      # Persist PDFs on the lab_data volume mounted at /data (rootfs is read-only).
      DATA_DIR: /data
      ENABLE_LEGACY_EA_BRIDGE: "false"
      ENABLE_LEGACY_CUSTOMER_EXECUTION: "false"
      ENABLE_LEGACY_RESEARCH_LOOP: "false"
      COMMERCIAL_REPORTS_SALE_ENABLED: ${COMMERCIAL_REPORTS_SALE_ENABLED:-false}
      PAYMENT_USDT_ENABLED: ${PAYMENT_USDT_ENABLED:-false}
      DATABASE_URL: postgresql://${POSTGRES_USER:-zupirus}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production}@timescaledb:5432/${POSTGRES_DB:-zupirus_quant}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in production}@redis:6379/0
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set in production}
      REPORT_DOWNLOAD_SECRET: ${REPORT_DOWNLOAD_SECRET:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in production}
      ALLOWED_ORIGINS: "https://zupirus.com,https://www.zupirus.com,https://app.zupirus.com,https://adm.zupirus.com"
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-ZUPIRUS Quant Lab <system@zupirus.com>}
      USDT_TRC20_ADDRESS: ${USDT_TRC20_ADDRESS:-}
      USDT_BEP20_ADDRESS: ${USDT_BEP20_ADDRESS:-}
    networks:
      private:
      npm_default:
        aliases:
          - zupirus-api

  research:
    environment:
      APP_ENV: "production"
      DATA_DIR: /data
      ENABLE_LEGACY_EA_BRIDGE: "false"
      ENABLE_LEGACY_CUSTOMER_EXECUTION: "false"
      ENABLE_LEGACY_RESEARCH_LOOP: "false"
      COMMERCIAL_REPORTS_SALE_ENABLED: ${COMMERCIAL_REPORTS_SALE_ENABLED:-false}
      PAYMENT_USDT_ENABLED: ${PAYMENT_USDT_ENABLED:-false}
      DATABASE_URL: postgresql://${POSTGRES_USER:-zupirus}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production}@timescaledb:5432/${POSTGRES_DB:-zupirus_quant}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in production}@redis:6379/0

volumes:
  lab_data:
    external: true
    name: zupirus_quant_lab_data

networks:
  npm_default:
    external: true
