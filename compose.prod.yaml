# Production override for VPS deployment behind Nginx Proxy Manager
services:
  api:
    environment:
      APP_ENV: "production"
      COOKIE_SECURE: "true"
      ALLOWED_ORIGINS: "http://localhost:8080,https://zupirus.com,https://www.zupirus.com,https://app.zupirus.com,https://adm.zupirus.com"
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-ZUPIRUS Quant Lab <system@zupirus.com>}
      SEPAY_WEBHOOK_SECRET: ${SEPAY_WEBHOOK_SECRET:-}
      SEPAY_BANK_NAME: ${SEPAY_BANK_NAME:-VietinBank}
      SEPAY_ACCOUNT_NUMBER: ${SEPAY_ACCOUNT_NUMBER:-105887054819}
      SEPAY_ACCOUNT_HOLDER: ${SEPAY_ACCOUNT_HOLDER:-LE NGUYEN NHU THUY}
      METAAPI_TOKEN: ${METAAPI_TOKEN:-}
    networks:
      private:
      npm_default:
        aliases:
          - zupirus-api

  execution:
    environment:
      APP_ENV: "production"

  research:
    environment:
      APP_ENV: "production"

networks:
  npm_default:
    external: true

