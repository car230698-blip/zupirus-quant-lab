name: zupirus-quant-lab

services:
  zupirus-quant-lab:
    container_name: zupirus-quant-lab-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Chỉ bind vào loopback 127.0.0.1:3100 trên VPS (mở qua SSH tunnel từ máy trạm người vận hành)
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - EXECUTION_MODE=SIMULATION_ONLY
      - DATA_DIR=/app/data/runtime${QUANT_RUNTIME_SUFFIX:-}
      - REPLAY_FILE=/app/data/xauusd_m15_replay.json
      - REPLAY_INTERVAL_MS=${REPLAY_INTERVAL_MS:-800}
      - QUANT_DATA_SOURCE=${QUANT_DATA_SOURCE:-REPLAY_DATASET}
      - AUTO_START_LOOP=${AUTO_START_LOOP:-true}
      - ENFORCE_STRICT_AUTH=${ENFORCE_STRICT_AUTH:-true}
      - ADMIN_AUTH_TOKEN=${ADMIN_AUTH_TOKEN:-}
      - VIEWER_AUTH_TOKEN=${VIEWER_AUTH_TOKEN:-}
      - COLLECTOR_AUTH_TOKEN=${COLLECTOR_AUTH_TOKEN:-}
    volumes:
      - zupirus_quant_lab_data:/app/data/runtime
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  zupirus_quant_lab_data:
    name: zupirus_quant_lab_data
